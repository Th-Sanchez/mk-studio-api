server:
  port: ${PORT:8080}

spring:
  application:
    name: mk-studio-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mk_studio}
    username: ${DB_USERNAME:mk_studio}
    password: ${DB_PASSWORD:mk_studio_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt-secret: ${JWT_SECRET:dev-only-change-this-secret-key-with-at-least-32-characters-123456}
    jwt-expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  admin:
    name: ${APP_ADMIN_NAME:Personal MK Studio}
    email: ${APP_ADMIN_EMAIL:admin@mkstudio.local}
    password: ${APP_ADMIN_PASSWORD:admin123}
